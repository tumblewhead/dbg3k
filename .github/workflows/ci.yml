name: Python checks
on:
  push:
    branches:
      - main
      - feature/m0-1-mi-textual-scope-001
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dbg3k
        run: python -m pip install -e .
      - name: Check TUI imports
        run: python -c "from dbg3k.app import DebuggerApp; print('Textual app imports')"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python
        run: python -m compileall -q src tests
